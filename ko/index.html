<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>텀블러 마스터 | 까다로운 사람을 위한 검증된 텀블러 필터</title>
    <meta
      name="description"
      content="입구 내경, 밀폐, 세라믹 코팅, 분해 세척, 컵홀더 호환 등 검증된 조건으로 텀블러를 필터링하세요."
    />
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body data-lang="ko">
    <header class="topbar">
      <a class="brand" href="./" aria-label="텀블러 마스터 홈">
        <span class="brand-mark">TM</span>
        <span>텀블러 마스터</span>
      </a>
      <div class="topbar-actions">
        <nav class="language-switch" aria-label="Language">
          <a aria-current="page" href="../ko/">한국어</a>
          <a href="../en/">English</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="intro">
        <div>
          <p class="eyebrow">Tumbler master / 텀블러 마스터</p>
          <h1>텀블러 마스터</h1>
          <p class="intro-copy">
            입구 지름, 밀폐, 세라믹 코팅, 분해 세척, 컵홀더 호환처럼 실제 구매에 중요한
            조건을 검증된 정보 기준으로만 필터링합니다.
          </p>
        </div>
        <div class="prototype-note" role="note">
          <strong>Prototype</strong>
          <span>현재 19개 제품은 필터 UX 확인용 데모 데이터입니다. 출시 전 실제 출처 검증이 필요합니다.</span>
        </div>
      </section>

      <section class="app-shell" aria-label="Tumbler filter">
        <aside class="filters-panel">
          <div class="panel-heading">
            <p class="eyebrow">Tumblers</p>
            <h2>필터</h2>
          </div>
          <form id="filters" class="filters" autocomplete="off"></form>
          <button id="resetFilters" class="reset-button" type="button">필터 초기화</button>
        </aside>

        <section class="results-panel">
          <div class="results-toolbar">
            <div>
              <p class="eyebrow">Verified-only logic</p>
              <h2 id="resultsTitle">결과</h2>
            </div>
            <div class="toolbar-actions">
              <label class="sort-control">
                <span>정렬</span>
                <select id="sortBy" name="sortBy">
                  <option value="match">조건 우선</option>
                  <option value="priceAsc">가격 낮은순</option>
                  <option value="mouthDesc">입구 넓은순</option>
                  <option value="capacityDesc">용량 큰순</option>
                </select>
              </label>
            </div>
          </div>
          <div id="activeFilters" class="active-filters" aria-live="polite"></div>
          <div id="results" class="product-grid" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <script src="../data/tumblers.demo.js"></script>
    <script src="../assets/app.js"></script>
  </body>
</html>
